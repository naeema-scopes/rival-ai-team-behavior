[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rival-ai-team-behavior"
version = "1.0.0"
description = "Deception and collusion when rival AI agent teams co-write a safety standard"
requires-python = ">=3.10"
dependencies = ["requests", "numpy", "pandas", "scipy", "statsmodels", "matplotlib"]

[tool.setuptools]
packages = ["swarm_pilot"]
